<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message Sent | Sunny Day Adventures</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .success-page {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1rem;
      background: linear-gradient(160deg, #0a3d5c 0%, #0c6b8a 100%);
      color: #fff;
    }
    .success-box {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      max-width: 480px;
    }
    .success-box h1 {
      font-size: 2rem;
      margin-bottom: 0.75rem;
      color: #ffe066;
    }
    .success-box p {
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
      opacity: 0.95;
    }
    .success-box .btn {
      margin: 0.4rem;
    }
  </style>
</head>
<body>
  <div class="success-page">
    <div class="success-box">
      <h1>Thanks! Message sent.</h1>
      <p>We’ve received your message and will get back to you as soon as possible.</p>
      <p>For the fastest reply, you can also message us on WhatsApp.</p>
      <a href="https://wa.me/12844411733" class="btn btn-whatsapp" target="_blank" rel="noopener">WhatsApp Us</a>
      <a href="index.html" class="btn btn-yellow">Back to Home</a>
    </div>
  </div>
</body>
</html>
